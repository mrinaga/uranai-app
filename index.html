    body {
      font-family: sans-serif;
      background-color: #e7f7ee;
      text-align: center;
      padding: 40px 20px;
    }
    h1 {
      color: #d94f7a;
      font-size: 28px;
    }
    p {
      color: #555555;
    }
    .field {
      margin: 20px 0;
      font-size: 18px;
    }
    .or {
      font-size: 14px;
      color: #777777;
      margin-top: 10px;
    }
    input, select, textarea {
      font-size: 18px;
      padding: 8px;
      margin-top: 8px;
      font-family: inherit;
    }
    #birthdayText, #nickname, textarea {
      width: 100%;
      max-width: 320px;
      box-sizing: border-box;
    }
    textarea {
      font-size: 16px;
    }
    button {
      background-color: #d94f7a;
      color: white;
      font-size: 20px;
      padding: 16px 40px;
      border: none;
      border-radius: 999px;
      margin-top: 8px;
    }
    button:disabled {
      opacity: 0.5;
    }

    /* ここからレシートの見た目 */
    #result {
      display: none;
      background-color: white;
      max-width: 320px;
      margin: 32px auto;
      padding: 20px;
      text-align: left;
      font-size: 15px;
      line-height: 1.7;
      border: 1px dashed #999999;
    }
    #result p {
      margin: 10px 0;
      color: #333333;
    }
    #result hr {
      border: none;
      border-top: 1px dashed #999999;
    }
    #result .loading {
      text-align: center;
      font-size: 17px;
      font-weight: bold;
      color: #d94f7a;
    }

    /* ===== 待ち時間の演出 ===== */
    .stage {
      text-align: center;
    }
    /* 馬の写真が切り替わる丸い枠（ルーレット） */
    .roulette {
      width: 200px;
      height: 200px;
      margin: 8px auto 4px;
      border-radius: 50%;
      background-color: #fff5f8;
      border: 4px solid #d94f7a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      box-shadow: 0 0 0 6px #fde3ec;
    }
    .roulette img {
      max-width: 82%;
      max-height: 82%;
    }
    .roulette.stopped {
      animation: pop 0.5s ease-out;
    }
    /* キャラが走るコース */
    .track {
      position: relative;
      height: 64px;
      margin: 14px 4px 0;
      border-bottom: 4px dashed #8fbf8f;
    }
    .track .gate,
    .track .goal {
      position: absolute;
      bottom: 4px;
      font-size: 12px;
      font-weight: bold;
      color: #5a8f5a;
    }
    .track .gate { left: 0; }
    .track .goal { right: 0; }
    .track .runner {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 60px;
      animation: hop 0.35s ease-in-out infinite alternate;
    }
    /* ルーレットが止まったときの「？」 */
    .secret {
      font-size: 110px;
      font-weight: bold;
      color: #d94f7a;
      line-height: 1;
    }
    /* 2段階目：キャラが床の紙にクレヨンで描いている絵（images/character/write.png） */
    .writing {
      position: relative;
      width: 340px;
      max-width: 100%;
      aspect-ratio: 1076 / 582;
      margin: 10px auto 4px;
    }
    .writing-inner {
      position: absolute;
      inset: 0;
      transform-origin: 26% 65%;   /* クレヨンの先を中心に、体を少しゆらす */
      animation: sway 1.2s ease-in-out infinite alternate;
    }
    .writing-inner img,
    .writing-inner svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .scribble {
      fill: none;
      stroke: #2f6fd1;

    const styleColors = {

      "先行": { name: "さくら色", hex: "#f4a7c0", reason: "周りに安心を届けるあなたのやさしさに合う色です。" },
      "差し": { name: "そら色", hex: "#8fb8e8", reason: "落ち着いて周りを見渡すあなたの冷静さに合う色です。" },
      "追込": { name: "わかば色", hex: "#a8cf7a", reason: "これからぐんと伸びるあなたの力に合う色です。" }
    };

    // 色を白に混ぜて、背景向けのやわらかい色にする道具（amount：白の割合）
    function softColor(hex, amount) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const mix = function (c) { return Math.round(c + (255 - c) * amount); };
      return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
    }

    // 色を黒に混ぜて、文字向けの濃い色にする道具（amount：黒の割合）
    function deepColor(hex, amount) {
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      const mix = function (c) { return Math.round(c * (1 - amount)); };
      return "rgb(" + mix(r) + "," + mix(g) + "," + mix(b) + ")";
    }

    // 走り方ごとのキャラのポーズ（file は images/character/ の中の画像の名前）
    const stylePoses = {
      "逃げ": { file: "run", label: "走る" },
      "先行": { file: "wave", label: "手を振る" },
      "差し": { file: "think", label: "考える" },
      "追込": { file: "jump", label: "ジャンプ" }
    };

    // 水彩のしぶきに使う色（ラッキーカラーに加えて混ぜる色）
    const baseSplashColors = ["#7fb3e6", "#e68fb3", "#f2b880", "#a98fe6", "#8fd6c0", "#f28b8b"];

    // リストからランダムに1つ選ぶ道具
    function pickRandom(list) {
      return list[Math.floor(Math.random() * list.length)];
    }

    // min〜max のあいだのランダムな数を作る道具
    function randomBetween(min, max) {
      return min + Math.random() * (max - min);
    }

    // 数字を2けたにする道具（5 → "05"）
    function twoDigits(number) {
      return String(number).padStart(2, "0");
    }

    // < や > が入っていても、そのまま文字として表示する道具
    function escapeHtml(text) {
      return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // 指定した時間だけ待つ道具
    function wait(ms) {
      return new Promise(function (resolve) {
        setTimeout(resolve, ms);
      });
    }

    // 全角の数字やスラッシュを半角にする道具（２０００／１／１ → 2000/1/1）
    function toHalfWidth(text) {
      return text
        .replace(/[０-９]/g, function (ch) {
          return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
        })
        .replace(/／/g, "/");
    }

    // 生年月日を読み取る道具（入力欄が優先、なければカレンダー）
    function getBirthday() {
      const typed = toHalfWidth(birthdayText.value).replace(/\s/g, "");
      let year, month, day;

      if (typed !== "") {
        const match =
          typed.match(/^(\d{4})(\d{2})(\d{2})$/) ||
          typed.match(/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?$/);
        if (!match) {
          return null;
        }
        year = Number(match[1]);
        month = Number(match[2]);
        day = Number(match[3]);
      } else {
        const parts = birthday.value.split("-");
        year = Number(parts[0]);
        month = Number(parts[1]);
        day = Number(parts[2]);
      }

      // 本当にある日付か確かめる（2月30日などをはじく）
      const check = new Date(year, month - 1, day);
      if (check.getFullYear() !== year || check.getMonth() !== month - 1 || check.getDate() !== day) {
        return null;
      }
      // 1900年より前や、未来の日付もはじく
      if (year < 1900 || check > new Date()) {
        return null;
      }

      return { year: year, month: month, day: day };
    }

    // 馬の性格から、キャラの配置を決める道具
    function choosePlacement(personality) {
      if (/甘えん坊|寂しがり|人懐っこい/.test(personality)) {
        return "snuggle";  // 馬に寄り添う
      }
      if (/王様|プライド|暴君|貴族|お坊ちゃま|天才/.test(personality)) {
        return "front";    // 前に堂々と立つ
      }
      return "side";       // 横に並ぶ
    }

    // ===== 待ち時間の演出 =====

    // 1段階目：馬の写真をルーレットのように切り替えて、最後に相棒の馬で止める
    // 止まったら、ふつうに次へ進む（Promise を返す）
    function playSearching(chosenHorse) {
      result.innerHTML = `
        <div class="stage">
          <p class="loading">今日の相棒を探しています<span class="dots"></span></p>
          <div class="roulette" id="roulette"><img id="rouletteImg" alt=""></div>
          <div class="track">
            <span class="gate">START</span>
            <span class="goal">GOAL</span>
            <img class="runner" id="runner" src="images/character/run.png" alt="">
          </div>
        </div>
      `;
      // スマホでも演出が見えるように、演出のところまで自動でスクロールする
      result.scrollIntoView({ behavior: "smooth", block: "start" });

      const roulette = document.getElementById("roulette");
      const img = document.getElementById("rouletteImg");
      const runner = document.getElementById("runner");
      const track = runner.parentElement;

      // 画像が見つからないときは、その部分を見えなくするだけにする
      img.onerror = function () { img.style.visibility = "hidden"; };
      img.onload = function () { img.style.visibility = "visible"; };
      runner.onerror = function () { runner.style.display = "none"; };

      // 馬の写真を先に読み込んでおく（切り替えがカクカクしないように）
      horses.forEach(function (h) {
        const pre = new Image();
        pre.src = "images/horses/" + h.id + ".png";
      });

      return new Promise(function (resolve) {
        const start = Date.now();
        let last = -1;

        // キャラをスタートからゴールまで動かす
        function moveRunner() {
          const t = Math.min((Date.now() - start) / SEARCH_TIME, 1);
          const maxLeft = track.clientWidth - runner.clientWidth;
          runner.style.left = (maxLeft * t) + "px";
          if (t < 1) {
            requestAnimationFrame(moveRunner);
          }
        }
        requestAnimationFrame(moveRunner);

        // 写真を切り替える（最初は速く、だんだんゆっくり）
        function spin() {
          const t = (Date.now() - start) / SEARCH_TIME;
          if (t >= 1) {
            // 誰が相棒かはまだ秘密。「？」で止める
            roulette.innerHTML = '<span class="secret">？</span>';
            roulette.classList.add("stopped");
            document.querySelector(".stage .loading").textContent = "今日の相棒が決まりました！";
            setTimeout(resolve, 1200);
            return;
          }
          let i;
          do {
            i = Math.floor(Math.random() * horses.length);
          } while (i === last && horses.length > 1);
          last = i;
          img.src = "images/horses/" + horses[i].id + ".png";
          const delay = 70 + t * t * 650;   // 70ミリ秒 → 720ミリ秒へ、だんだん遅く
          setTimeout(spin, delay);
        }
        spin();
      });
    }

    // 2段階目：キャラが床の紙に、クレヨンであなたへのメッセージを描いている（中身はまだ秘密）
    // 絵は images/character/write.png。クレヨンの先から、ぐるぐる線が描かれていく
    function showFound(chosenHorse) {
      result.innerHTML = `
        <div class="stage">
          <p class="loading">相棒を見つけました！</p>
          <div class="writing">
            <div class="writing-inner">
              <img src="${WRITE_IMAGE}" alt="">
              <svg viewBox="0 0 1076 582">
                <path class="scribble" pathLength="1"
                  d="M286 376 C 266 371, 232 370, 223 392 C 214 414, 252 420, 252 402 C 252 386, 211 391, 207 416 C 203 440, 250 448, 250 428 C 250 412, 209 418, 205 444 C 201 470, 228 494, 254 492" />
              </svg>
            </div>
          </div>
          <p class="loading">相棒が、あなたへの<br>メッセージを書いています<span class="dots"></span></p>
        </div>
      `;
    }

    // 画像がまだないときに出す、点線の枠を作る道具
    function makePlaceholder(className, text) {
      const box = document.createElement("div");
      box.className = "ph " + className;
      box.textContent = text;
      return box;
    }

    // ニックネームの文字の種類を調べる道具
    // "kanji"（漢字）・"hiragana"（ひらがな）・"katakana"（カタカナ）・"latin"（ローマ字）・"none"（なし）
    function nicknameType(nick) {
      if (nick === "") {
        return "none";
      }
      if (/[\u4E00-\u9FFF\u3400-\u4DBF々]/.test(nick)) {
        return "kanji";
      }
      const hira = (nick.match(/[\u3041-\u309F]/g) || []).length;
      const kata = (nick.match(/[\u30A1-\u30FA\uFF66-\uFF9D]/g) || []).length;
      if (hira > 0 || kata > 0) {
        return hira >= kata ? "hiragana" : "katakana";
      }
      return "latin";
    }

    // カタカナをひらがなにする道具（ドリームジャーニー → どりーむじゃーにー）
    function toHiragana(text) {
      return text.replace(/[\u30A1-\u30F6]/g, function (ch) {
        return String.fromCharCode(ch.charCodeAt(0) - 0x60);
      });
    }

    // ニックネームの種類に合わせて、馬の名前の書き方とフォントを決める道具
    function titleStyle(type, horse) {
      if (type === "kanji") {
        return { horseName: horse.name, font: "font-cool", family: "Dela Gothic One" };
      }
      if (type === "hiragana") {
        return { horseName: toHiragana(horse.name), font: "font-cute", family: "Hachi Maru Pop" };
      }
      if (type === "katakana") {
        return { horseName: horse.name, font: "font-pop", family: "Mochiy Pop One" };
      }
      return { horseName: horse.en || horse.name, font: "font-cursive", family: "Great Vibes" };
    }

    // 文字が枠からはみ出さないように、大きさを合わせる道具
    // maxRatio：枠の幅に対して、いちばん大きいときの文字の大きさ
    function fitText(el, container, maxRatio, family) {
      function fit() {
        const maxWidth = container.clientWidth * 0.92;
        let size = container.clientWidth * maxRatio;
        el.style.fontSize = size + "px";
        while (el.offsetWidth > maxWidth && size > 10) {
          size -= 1;
          el.style.fontSize = size + "px";
        }
      }
      fit();
      // フォントの読み込みが終わったら、もう一度合わせる
      if (document.fonts) {
        document.fonts.load('40px "' + family + '"', el.textContent).then(fit).catch(function () {});
      }
    }

    // イラストを組み立てる道具
    // dates：イラストに入れる日付の情報（{ birthday: {year,month,day} または null, today: Date または null }）
    function buildIllustration(container, horse, style, colorHex, nickname, dates) {
      nickname = nickname || "";
      dates = dates || { birthday: null, today: null };
      // 背景の色（ラッキーカラーをやわらかくして使う）
      container.style.backgroundColor = softColor(colorHex, 0.45);
      const splashColors = [colorHex, softColor(colorHex, 0.3)].concat(baseSplashColors);

      // ふんわりした雲（下のほう）
      for (let i = 0; i < 4; i++) {
        const cloud = document.createElement("div");
        cloud.className = "cloud";
        cloud.style.width = randomBetween(90, 160) + "px";
        cloud.style.height = randomBetween(50, 90) + "px";
        cloud.style.left = randomBetween(-10, 75) + "%";
        cloud.style.bottom = randomBetween(0, 30) + "%";
        cloud.style.backgroundColor = pickRandom(splashColors);
        container.appendChild(cloud);
      }

      // 水彩のしぶき
      for (let i = 0; i < 14; i++) {
        const dot = document.createElement("div");
        const size = randomBetween(5, 28);
        dot.className = "splash";
        dot.style.width = size + "px";
        dot.style.height = size + "px";
        dot.style.left = randomBetween(0, 95) + "%";
        dot.style.top = randomBetween(10, 90) + "%";
        dot.style.backgroundColor = pickRandom(splashColors);
        container.appendChild(dot);
      }

      // 馬の名前とニックネーム。ニックネームの文字の種類でフォントが変わる
      const type = nicknameType(nickname);
      const look = titleStyle(type, horse);
      const isJapanese = type === "kanji" || type === "hiragana" || type === "katakana";

      const title = document.createElement("div");
      title.className = "illust-title";
      const nameText = document.createElement("div");
      nameText.className = "illust-name " + look.font;
      nameText.textContent = look.horseName;
      nameText.style.color = deepColor(colorHex, isJapanese ? 0.6 : 0.45);
      title.appendChild(nameText);
      container.appendChild(title);
      // 日本語は筆記体より字が大きく見えるので、少し小さめにする
      fitText(nameText, container, isJapanese ? 0.14 : 0.24, look.family);

      if (nickname !== "") {
        title.appendChild(document.createElement("br"));
        const nickText = document.createElement("div");
        nickText.className = "illust-nick " + look.font;
        nickText.textContent = type === "latin" ? "& " + nickname : "＆ " + nickname;
        nickText.style.color = deepColor(colorHex, isJapanese ? 0.5 : 0.3);
        title.appendChild(nickText);
        fitText(nickText, container, isJapanese ? 0.09 : 0.14, look.family);
      }

      // 相棒の馬（画像がなければ点線の枠）
      const horseImg = document.createElement("img");
      horseImg.className = "illust-horse";
      if (nickname !== "") {
        horseImg.style.height = "70%";   // ニックネームの分だけ、馬を少し小さくする
      }
      horseImg.src = "images/horses/" + horse.id + ".png";
      horseImg.alt = horse.name;
      horseImg.onerror = function () {
        horseImg.replaceWith(
          makePlaceholder("illust-horse ph-horse", horse.name + "の写真\n（images/horses/" + horse.id + ".png）")
        );
      };
      container.appendChild(horseImg);

      // キャラ（走り方でポーズ、馬の性格で配置が変わる）
      const pose = stylePoses[style];
      const placement = choosePlacement(horse.personality);
      const charaImg = document.createElement("img");
      charaImg.className = "illust-chara " + placement;
      charaImg.src = "images/character/" + pose.file + ".png";
      charaImg.alt = "キャラクター";
      charaImg.onerror = function () {
        charaImg.replaceWith(
          makePlaceholder("illust-chara ph-chara " + placement, "キャラ\nポーズ：" + pose.label + "\n（" + pose.file + ".png）")
        );
      };
      container.appendChild(charaImg);

      // 日付（チェックしたものだけ）。キャラと重ならない側に置く
      const lines = [];
      if (dates.birthday) {
        const b = dates.birthday;
        lines.push(isJapanese
          ? b.year + "." + b.month + "." + b.day + " 生まれ"
          : "Born " + b.year + "." + b.month + "." + b.day);
      }
      if (dates.today) {
        const t = dates.today;
        const text = t.getFullYear() + "." + (t.getMonth() + 1) + "." + t.getDate();
        lines.push(isJapanese ? text + " の相棒" : text);
      }
      if (lines.length > 0) {
        const dateBox = document.createElement("div");
        dateBox.className = "illust-dates " + look.font + (placement === "front" ? " on-right" : " on-left");
        dateBox.style.color = deepColor(colorHex, isJapanese ? 0.6 : 0.45);
        dateBox.style.fontSize = (container.clientWidth * (isJapanese ? 0.05 : 0.09)) + "px";
        lines.forEach(function (line, i) {
          if (i > 0) {
            dateBox.appendChild(document.createElement("br"));
          }
          dateBox.appendChild(document.createTextNode(line));
        });
        container.appendChild(dateBox);
      }
    }

    button.addEventListener("click", async function () {
      result.style.display = "block";

      // ニックネーム（なくてもOK）
      const nickname = nicknameInput.value.trim();

      // 気分：自由に書いた文があればそちらを優先、なければ選んだもの
      const moodValue = moodText.value.trim() || mood.value;

      // 入力チェック
      if (birthday.value === "" && birthdayText.value.trim() === "") {
        result.innerHTML = "<p>生年月日を入れてね</p>";
        return;
      }
      if (moodValue === "") {
        result.innerHTML = "<p>今日の気分を選ぶか、自由に書いてね</p>";
        return;
      }

      const birthdayInfo = getBirthday();
      if (birthdayInfo === null) {
        result.innerHTML = "<p>生年月日の書き方を確認してね<br>（例：20000101 や 2000/1/1）</p>";
        return;
      }

      const year = birthdayInfo.year;
      const month = birthdayInfo.month;
      const day = birthdayInfo.day;

      // 仮の判定：生年月日の数字を足して、4で割った余りで走り方を決める
      const style = styles[(year + month + day) % 4];

      // ===== その人の性格を出す =====
      const person = getPersonTraits(year, month, day, moodValue);

      // 誕生月の毛色
      const monthColor = monthColors[month - 1];

      // ===== 性格の近さで馬を選ぶ =====
      const horse = chooseHorse(person, style, monthColor, day);

      // 占った日時
      const now = new Date();
      const dateText = now.getFullYear() + "年" + (now.getMonth() + 1) + "月" + now.getDate() + "日 "
                     + twoDigits(now.getHours()) + ":" + twoDigits(now.getMinutes());

      // 運勢の星・ラッキープレイス・グルメ（AIに渡すので先に決める）
      const stars = pickRandom(fortunes);
      const place = pickRandom(luckyPlaces);
      const food = pickRandom(luckyFoods);

      // まずはテンプレートの文章を用意（AIが失敗したときの予備）
      let advice = moodAdvice[moodValue] || "今日は自分のペースを大切にすると吉。";

      // ボタンを押せないようにする
      button.disabled = true;

      // AIへのお願いは、すぐに送っておく（待っている間に文章を作ってもらう）
      const aiRequest = fetch(WORKER_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          stars: stars,
          mood: moodValue,
          style: style,
          horseName: horse.name,
          horseColor: horse.color,
          horsePersonality: horse.personality,
          personTraits: person.labels.join("・"),
          luckyPlace: place,
          luckyFood: food
        })
      })
        .then(function (response) {
          return response.json();
        })
        .catch(function (error) {
          return { error: "中継係につながりませんでした: " + error };
        });

      // ===== 1段階目：相棒を探しています（ルーレットとキャラのかけっこ） =====
      await playSearching(horse);

      // ===== 2段階目：相棒を見つけました =====
      showFound(horse);

      // AIの返事と、最低3秒の待ち時間の「両方」が終わるまで待つ
      const results = await Promise.all([aiRequest, wait(FOUND_TIME)]);
      const data = results[0];

      // ラッキーカラー（まずは予備の色）
      let luckyColor = styleColors[style];

      if (data.text) {
        advice = escapeHtml(data.text);
      } else {
        console.log("AIのエラー:", data.error);
      }

      // AIが選んだ色が正しい形（#から始まる6けた）なら、それを使う
      if (data.colorHex && /^#[0-9a-fA-F]{6}$/.test(data.colorHex) && data.colorName) {
        luckyColor = {
          name: data.colorName,
          hex: data.colorHex,
          reason: data.colorReason || ""
        };
      }

      button.disabled = false;

      // レシートを組み立てる（資料2-5の順番。イラストはいちばん下）
      result.innerHTML = `
        <div class="receipt-title">占い結果レシート</div>
        <hr>
        <p><span class="label">占った日時・場所</span><br>${dateText}<br>道の駅サラブレッドロード新冠</p>
        ${nickname !== "" ? `<p><span class="label">ニックネーム</span><br>${escapeHtml(nickname)}</p>` : ""}
        <p><span class="label">生年月日</span><br>${year}年${month}月${day}日</p>
        <p><span class="label">気になること</span><br>${escapeHtml(moodValue)}</p>
        <hr>
        <p><span class="label">あなたの今日の運勢</span><br>${stars}<br>${advice}</p>
        <p><span class="label">旅のラッキープレイス</span><br>${place}</p>
        <p><span class="label">ラッキーグルメ</span><br>${food}</p>
        <p><span class="label">ラッキーカラー</span><br><span class="swatch" style="background-color:${luckyColor.hex}"></span>${escapeHtml(luckyColor.name)}<br>${escapeHtml(luckyColor.reason)}</p>
        <hr>
        <p><span class="label">隠れた性格：走り方は「${style}」</span><br>あなたは「${person.labels.join("・")}」タイプ。${styleTexts[style]}</p>
        <p><span class="label">馬に例えたら</span><br>${horse.name}（${horse.color}・${horse.styles.join("・")}）<br>${horse.personality}</p>
        <hr>
        <div class="illust" id="illust"></div>
      `;

      // レシートのいちばん上まで自動でスクロールする
      result.scrollIntoView({ behavior: "smooth", block: "start" });

      // イラストを組み立てる
      buildIllustration(document.getElementById("illust"), horse, style, luckyColor.hex, nickname, {
        birthday: showBirthday.checked ? { year: year, month: month, day: day } : null,
        today: showToday.checked ? now : null
      });
    });
  </script>
</body>
</html>
